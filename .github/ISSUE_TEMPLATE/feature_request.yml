name: Feature request
description: Suggest an idea for LinkPoll
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mock-ups and examples from other apps are welcome.
    validations:
      required: true
